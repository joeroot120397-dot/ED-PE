name: vitalrise
description: >-
  VitalRise - an educational men's sexual wellness coach. Personalised pelvic
  floor training, nutrition and lifestyle guidance. Not a medical device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.5.0

  # Backend (auth, Postgres, storage, edge functions)
  supabase_flutter: ^2.17.1

  # Analytics / push
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_messaging: ^16.5.0

  # Storage & security
  shared_preferences: ^2.5.5
  # Pinned below 11.x deliberately: 11.0.0 requires compileSdk 37, which
  # the Android Gradle Plugin shipped with Flutter 3.44 does not support
  # (it caps at 36). Bumping this breaks `flutter build apk` outright.
  # Revisit when the Flutter template ships a newer AGP.
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0

  # UI
  fl_chart: ^1.2.0
  lottie: ^3.5.1
  flutter_svg: ^2.3.0

  # Utilities
  collection: ^1.19.1
  intl: ^0.20.3
  meta: ^1.18.0
  uuid: ^4.6.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/illustrations/

  # Inter is bundled rather than fetched at runtime. See app_theme.dart for
  # why that is not just a size/latency trade.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
