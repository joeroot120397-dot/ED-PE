name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --line-length 80 --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter expanded

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  assets:
    name: Animations are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A hand-edited animation that the generator would not produce is a
      # drift bug: the next regeneration would silently revert it.
      - name: Regenerate and diff
        run: |
          python3 tool/generate_animations.py
          if ! git diff --quiet -- assets/animations; then
            echo "::error::assets/animations differs from generator output."
            echo "Run: python3 tool/generate_animations.py"
            git diff --stat -- assets/animations
            exit 1
          fi

  build:
    name: Android build
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - run: flutter pub get

      # No secrets: this proves the offline variant compiles and ships as a
      # working app, which is also what a store reviewer on a restricted
      # network will see.
      - name: Build debug APK (offline variant)
        run: flutter build apk --debug
