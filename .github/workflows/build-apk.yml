name: Build APK

# Produces an installable Android APK you can sideload onto a phone.
#
# The build runs here rather than locally because GitHub's ubuntu runners
# ship with the full Android SDK already installed - no sdkmanager, no
# licence acceptance, nothing to configure.
#
# The APK is debug-signed. That is fine for sideloading onto your own device
# and is *not* suitable for the Play Store, which needs a real upload key
# (see docs/DEPLOYMENT.md).
#
# The signing key is made stable on purpose. The Android Gradle Plugin
# creates ~/.android/debug.keystore with a fresh random keypair whenever the
# file is missing, and every CI runner starts empty - so each build was
# signed by a different key. Android refuses to install an update signed by
# a different key than the installed app, which forced an uninstall, and an
# uninstall wipes the encrypted health data with it. Losing every
# assessment on every update is not an acceptable way to ship updates.

on:
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: ["claude/**", "main"]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: write

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - run: flutter pub get

      # Restored before the build so Gradle finds an existing keystore and
      # does not mint a new one. A cache hit is what keeps consecutive builds
      # installable over each other.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vitalrise-sideload-keystore-v1

      - name: Settle the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "::notice title=Signing::Using the key from the \
          SIDELOAD_KEYSTORE_BASE64 secret."
          elif [ -f ~/.android/debug.keystore ]; then
            echo "::notice title=Signing::Reused the cached key, so this \
          build installs over the previous one."
          else
            keytool -genkeypair -noprompt \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "::warning title=New signing key::No cached or configured \
          key, so a new one was generated. This build will NOT install over \
          an existing copy - uninstall first, which erases its data. To make \
          the key permanent, base64 this run's keystore into a repository \
          secret named SIDELOAD_KEYSTORE_BASE64."
          fi

      # Printed every run so a key change is visible rather than discovered
      # by a failed install on the phone.
      - name: Report the signing fingerprint
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android 2>/dev/null \
            | grep -E 'SHA256:' | head -1

      # No --dart-define: this builds the offline variant, which is fully
      # functional on-device and needs no backend, no account and no keys.
      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename with the version and commit
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/vitalrise-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: vitalrise-apk
          path: dist/*.apk
          retention-days: 30

      # A release gives you a direct download link you can open on the
      # phone itself, instead of unzipping a CI artifact on a desktop.
      - name: Publish to a rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A heredoc rather than an inline --notes string, so the notes can
          # be edited as plain Markdown without every blank line and line
          # break having to survive two levels of quoting.
          cat > notes.md <<EOF
          Offline build for sideloading. Debug-signed: fine for your own
          device, not valid for the Play Store.

          **Install:** open this page on your Android phone, download the
          \`.apk\`, and allow installs from your browser when Android asks.

          No account, no backend and no network needed - the assessment,
          programme, exercises, nutrition and coach all run on-device.

          Installs over a previous build of the same signing key and keeps
          your data. If Android says "App not installed", the key changed:
          uninstall first, which erases what is stored on the device.

          Educational guidance only, not a substitute for medical advice.

          Built from \`${GITHUB_SHA}\`.
          EOF

          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk dist/*.apk \
            --title "VitalRise - latest test build" \
            --prerelease \
            --notes-file notes.md
