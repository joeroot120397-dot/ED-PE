name: Deploy web build

# Publishes the app to GitHub Pages so you can open it on any phone
# browser without installing anything.
#
# The web build is a genuine build of the same code - same engines, same
# screens, same offline storage. Two caveats worth knowing:
#   * Encrypted local storage uses the browser's WebCrypto and IndexedDB
#     rather than the platform keystore, which is weaker.
#   * Push notifications do not apply.
# Use it to try the app. Use the APK to actually live with it.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - run: flutter pub get

      # Pages serves the site from a subdirectory, so the base href has to
      # match the repository name or every asset 404s.
      - name: Build
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href "/${REPO_NAME}/"

      # Uploaded unconditionally: compiling for web is a real signal even
      # when publishing is unavailable, and this keeps the built site
      # downloadable from the run page either way.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      # enablement turns Pages on for the repo, but only if the workflow
      # token is allowed to administer Pages. On many repositories it is
      # not - the API answers "Resource not accessible by integration" -
      # and that is a repository setting, not something a build can fix.
      # So this step is allowed to fail and the deploy is skipped rather
      # than failing the whole run on every push forever.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain a skipped deploy
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Pages not enabled::The site built fine but \
          could not be published. Enable it once under Settings -> Pages \
          -> Build and deployment -> Source: GitHub Actions, then re-run \
          this workflow. Until then, download the 'web-build' artifact \
          from this run."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
