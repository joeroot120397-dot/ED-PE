<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="The two phases of ejaculation: emission, driven by the
     sympathetic nervous system, and expulsion, driven by rhythmic
     bulbospongiosus contraction, with the point of no return marked
     between them.">
  <title>The two phases of ejaculation</title>

  <!-- Arousal curve -->
  <path d="M28 246 C96 244 140 226 176 186 C206 152 220 116 236 96
           C250 78 268 72 286 72 C316 72 346 100 372 148"
        fill="none" stroke="#10B981" stroke-width="3.5"
        stroke-linecap="round" />

  <!-- Axes -->
  <g stroke="#DDE3ED" stroke-width="2">
    <line x1="28" y1="262" x2="376" y2="262" />
    <line x1="28" y1="40" x2="28" y2="262" />
  </g>
  <g font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">
    <text x="200" y="282" text-anchor="middle">Time</text>
    <text x="18" y="150" text-anchor="middle"
          transform="rotate(-90 18 150)">Arousal</text>
  </g>

  <!-- Point of no return -->
  <line x1="236" y1="52" x2="236" y2="262" stroke="#DC2626" stroke-width="2"
        stroke-dasharray="6 5" />
  <circle cx="236" cy="96" r="7" fill="#DC2626" />
  <g font-family="Inter, sans-serif">
    <text x="236" y="42" text-anchor="middle" font-size="11" fill="#B91C1C"
          font-weight="600">Point of no return</text>
    <text x="236" y="276" text-anchor="middle" font-size="9" fill="#B91C1C">
      after this, the reflex completes on its own
    </text>
  </g>

  <!-- Phase 1: emission -->
  <rect x="44" y="176" width="176" height="66" rx="12" fill="#EFF6FF"
        stroke="#3B82F6" stroke-width="1.8" />
  <g font-family="Inter, sans-serif">
    <text x="58" y="198" font-size="12" fill="#1D4ED8" font-weight="600">
      1. Emission
    </text>
    <text x="58" y="214" font-size="10" fill="#1E40AF">
      Sympathetic nerves fire. Vas deferens,
    </text>
    <text x="58" y="228" font-size="10" fill="#1E40AF">
      seminal vesicles and prostate load the urethra.
    </text>
  </g>

  <!-- Phase 2: expulsion -->
  <rect x="252" y="176" width="132" height="66" rx="12" fill="#ECFDF5"
        stroke="#047857" stroke-width="1.8" />
  <g font-family="Inter, sans-serif">
    <text x="264" y="198" font-size="12" fill="#065F46" font-weight="600">
      2. Expulsion
    </text>
    <text x="264" y="214" font-size="10" fill="#047857">
      Bulbospongiosus contracts
    </text>
    <text x="264" y="228" font-size="10" fill="#047857">
      rhythmically, every 0.8 s.
    </text>
  </g>

  <!-- Where training acts -->
  <g font-family="Inter, sans-serif">
    <rect x="44" y="52" width="164" height="60" rx="12" fill="#FFFBEB"
          stroke="#F59E0B" stroke-width="1.8" />
    <text x="56" y="72" font-size="11" fill="#92400E" font-weight="600">
      Where training helps
    </text>
    <text x="56" y="88" font-size="10" fill="#B45309">
      Recognising arousal earlier widens
    </text>
    <text x="56" y="102" font-size="10" fill="#B45309">
      the window before the red line.
    </text>
  </g>

  <!-- Contraction ticks under phase 2 -->
  <g stroke="#047857" stroke-width="3" stroke-linecap="round">
    <line x1="266" y1="152" x2="266" y2="164" />
    <line x1="288" y1="146" x2="288" y2="164" />
    <line x1="310" y1="150" x2="310" y2="164" />
    <line x1="332" y1="156" x2="332" y2="164" />
    <line x1="354" y1="159" x2="354" y2="164" />
  </g>
</svg>
