<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Cross-section comparing flaccid and erect states, showing
     smooth muscle relaxation, arterial inflow and venous compression.">
  <title>What changes between flaccid and erect</title>

  <g font-family="Inter, sans-serif">
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="600"
          fill="#0B1B2B">Flaccid</text>
    <text x="300" y="24" text-anchor="middle" font-size="13" font-weight="600"
          fill="#047857">Erect</text>
  </g>

  <!-- ============ Flaccid cross-section ============ -->
  <g transform="translate(100 130)">
    <circle r="66" fill="#EDF1F7" stroke="#94A3B8" stroke-width="3" />
    <circle cx="-26" cy="-14" r="30" fill="#CBD5E1" stroke="#94A3B8"
            stroke-width="2" />
    <circle cx="26" cy="-14" r="30" fill="#CBD5E1" stroke="#94A3B8"
            stroke-width="2" />
    <ellipse cy="34" rx="22" ry="18" fill="#DDE3ED" stroke="#94A3B8"
             stroke-width="2" />
    <circle cy="34" r="5" fill="#94A3B8" />
    <!-- constricted arteries -->
    <g stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-26 -14 l0 -1" />
      <circle cx="-26" cy="-14" r="4" />
      <circle cx="26" cy="-14" r="4" />
    </g>
    <!-- open veins -->
    <g stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-52 -46 l-12 -12" />
      <path d="M52 -46 l12 -12" />
    </g>
  </g>

  <!-- ============ Erect cross-section ============ -->
  <g transform="translate(300 130)">
    <circle r="76" fill="#D1FAE5" stroke="#047857" stroke-width="3.5" />
    <circle cx="-30" cy="-16" r="40" fill="#6EE7B7" stroke="#047857"
            stroke-width="2" />
    <circle cx="30" cy="-16" r="40" fill="#6EE7B7" stroke="#047857"
            stroke-width="2" />
    <ellipse cy="46" rx="24" ry="19" fill="#A7F3D0" stroke="#047857"
             stroke-width="2" />
    <circle cy="46" r="5" fill="#047857" />
    <!-- dilated arteries -->
    <g stroke="#DC2626" fill="none">
      <circle cx="-30" cy="-16" r="10" stroke-width="3" />
      <circle cx="30" cy="-16" r="10" stroke-width="3" />
    </g>
    <!-- compressed veins, shown flattened against the sheath -->
    <g stroke="#1D4ED8" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-58 -52 l-8 -8" stroke-dasharray="3 4" />
      <path d="M58 -52 l8 -8" stroke-dasharray="3 4" />
    </g>
  </g>

  <!-- Arrow between the two states -->
  <g stroke="#10B981" stroke-width="3" fill="none">
    <path d="M178 130 L216 130" />
    <path d="M208 123 L217 130 L208 137" stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
  <text x="197" y="118" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="10" fill="#059669">nitric oxide</text>

  <!-- Legend -->
  <g font-family="Inter, sans-serif" font-size="11">
    <circle cx="26" cy="240" r="6" fill="#6EE7B7" stroke="#047857"
            stroke-width="1.5" />
    <text x="40" y="244" fill="#0B1B2B">Corpora cavernosa - fill with blood</text>

    <circle cx="26" cy="262" r="6" fill="none" stroke="#DC2626"
            stroke-width="2.5" />
    <text x="40" y="266" fill="#0B1B2B">Arteries widen as smooth muscle relaxes</text>

    <line x1="20" y1="284" x2="32" y2="284" stroke="#1D4ED8" stroke-width="3"
          stroke-dasharray="3 4" />
    <text x="40" y="288" fill="#0B1B2B">Veins compressed shut - blood stays in</text>
  </g>
</svg>
